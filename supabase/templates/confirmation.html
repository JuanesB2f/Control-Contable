<!doctype html>
<html lang="es">
  <body style="margin:0;padding:32px 16px;background:#f4f9f4;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif;color:#1c241d;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:440px;background:#ffffff;border-radius:18px;padding:32px;">
            <tr>
              <td>
                <p style="margin:0 0 8px;font-size:13px;color:#2e7d32;font-weight:600;">VitaEsme</p>
                <h1 style="margin:0 0 12px;font-size:22px;font-weight:600;">Confirma tu correo</h1>
                <p style="margin:0 0 24px;font-size:15px;line-height:1.5;color:#424245;">
                  Solo falta un paso para crear tu cuenta. Toca el botón para confirmar tu correo y configurar tu negocio.
                </p>
                <a
                  href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email&next=/onboarding"
                  style="display:inline-block;background:#2e7d32;color:#ffffff;text-decoration:none;font-size:15px;font-weight:500;padding:12px 22px;border-radius:12px;"
                  >Confirmar correo</a
                >
                <p style="margin:24px 0 0;font-size:13px;line-height:1.5;color:#86868b;">
                  Si no creaste una cuenta, puedes ignorar este mensaje.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
